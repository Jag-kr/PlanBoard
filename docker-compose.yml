version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: planboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: planboard
      POSTGRES_PASSWORD: planboard
      POSTGRES_DB: planboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./planboard-server
      dockerfile: Dockerfile
    container_name: planboard_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgres://planboard:planboard@db:5432/planboard
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      CLIENT_URL: http://localhost:5173
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASS: ${GMAIL_PASS:-}
    ports:
      - "5000:5000"

  client:
    build:
      context: ./planboard-client
      dockerfile: Dockerfile
    container_name: planboard_client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:80"

volumes:
  pgdata:
